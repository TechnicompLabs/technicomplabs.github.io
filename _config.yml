title: "Technicomp Labs"
tagline: "Building, measuring, and restoring computing systems"
description: "An independent computing laboratory run by Paul D. Martin, Ph.D. Its projects include Technicomp Benchtop Linux, performance research on current hardware, and a collection of high-end computers from every decade."
url: "https://technicomplabs.io"
baseurl: ""
author: "Paul D. Martin, Ph.D."
logo: /assets/images/logo.png
timezone: America/New_York

# The dedicated Benchtop Linux site. Set live to true when it is ready for
# visitors; the Benchtop panel and page then link to it.
benchtop_site:
  url: "https://benchtoplinux.org"
  live: false

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: /blog/:year/:month/:title/

include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - BENCHTOP_PRODUCT_CONTENT.md
  - vendor

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

feed:
  path: feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: "_pages"
    values:
      layout: page
