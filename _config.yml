title: "Technicomp Labs"
description: "Systems performance, applied machine learning, and vintage computing, from the workshop of Paul D. Martin, Ph.D."
url: "https://technicomplabs.io"
baseurl: ""
author: "Paul D. Martin, Ph.D."
timezone: America/New_York

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: /blog/:year/:month/:title/

include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

feed:
  path: feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: "_pages"
    values:
      layout: page
