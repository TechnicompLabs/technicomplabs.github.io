title: "Technicomp Labs"
tagline: "Building, measuring, and restoring computing systems"
description: "The independent workshop of Paul D. Martin, Ph.D.: home of Technicomp Benchtop Linux, performance research on current hardware, and a collection of high-end computers from every decade."
url: "https://technicomplabs.io"
baseurl: ""
author: "Paul D. Martin, Ph.D."
logo: /assets/images/logo.png
timezone: America/New_York

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: /blog/:year/:month/:title/

include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

feed:
  path: feed.xml

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: "_pages"
    values:
      layout: page
