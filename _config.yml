# --- Site ---
title: "Technicomp Labs"
subtitle: "Systems performance, applied ML, and the engineering behind them."
name: "Technicomp Labs"
description: "Deep dives on systems performance, LLM inference, and applied machine learning — with real data from the lab."
# Set these when the repo/domain exist:
# url: "https://technicomplabs.com"          # base hostname & protocol
# baseurl: ""                                 # "" for a user/custom-domain site, "/repo-name" for a project site
# repository: "pauldmartinphd/technicomp-labs"

# --- Theme (Minimal Mistakes, GitHub Pages compatible) ---
remote_theme: "mmistakes/minimal-mistakes@master"
minimal_mistakes_skin: "default"   # options: air, aqua, contrast, dark, dirt, neon, mint, plum, sunrise
search: true

# --- Build ---
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
paginate: 10
paginate_path: /page:num/
timezone: America/New_York
words_per_minute: 200

include:
  - _pages

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-seo-tag

# --- Author (appears in the sidebar profile) ---
author:
  name: "Paul D. Martin, Ph.D."
  avatar: "/assets/images/bio-photo.jpg"   # add an image here, or remove this line
  bio: "Performance engineering and applied ML at Technicomp Labs."
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/pauldmartinphd"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/pauldmartinphd"

# --- Defaults ---
defaults:
  # posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
      show_date: true
      toc: true
      toc_sticky: true
  # pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
