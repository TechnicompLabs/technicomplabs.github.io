# --- Site ---
title: "Technicomp Labs"
subtitle: "Systems performance, applied ML, and vintage computing."
name: "Technicomp Labs"
description: "Systems performance, LLM inference, applied machine learning, and vintage computer restoration — with real data from the lab of Paul D. Martin, Ph.D."
url: "https://technicomplabs.io"   # custom domain
baseurl: ""                         # served at the apex, not a /repo path
repository: "TechnicompLabs/TechnicompLabs.github.io"   # org Pages repo

# --- Theme (Minimal Mistakes, GitHub Pages compatible) ---
remote_theme: "mmistakes/minimal-mistakes@master"
minimal_mistakes_skin: "default"   # options: air, aqua, contrast, dark, dirt, neon, mint, plum, sunrise
search: true

# --- Build ---
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge
paginate: 10
paginate_path: /page:num/
timezone: America/New_York
words_per_minute: 200

include:
  - _pages

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-seo-tag

# --- Author (appears in the sidebar profile) ---
author:
  name: "Paul D. Martin, Ph.D."
  avatar: "/assets/images/bio-photo.jpg"
  bio: "Systems performance, applied ML, and vintage computing at Technicomp Labs."
  links:
    - label: "pauldmartin.phd"
      icon: "fas fa-fw fa-link"
      url: "https://pauldmartin.phd"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/pauldmartinphd"

og_image: "/assets/images/lab-bench-window.jpg"

footer:
  links:
    - label: "pauldmartin.phd"
      icon: "fas fa-fw fa-link"
      url: "https://pauldmartin.phd"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/pauldmartinphd"

# --- Defaults ---
defaults:
  # posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: false
      share: true
      related: true
      show_date: true
      toc: true
      toc_sticky: true
  # pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
