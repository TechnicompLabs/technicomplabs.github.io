---
layout: default
---
<article class="measure post">
  <header class="page-header">
    <p class="kicker"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>{% if page.categories.size > 0 %} &middot; {{ page.categories | join: ", " }}{% endif %}</p>
    <h1>{{ page.title }}</h1>
    {% if page.excerpt and page.show_excerpt %}<p class="lede">{{ page.excerpt | strip_html }}</p>{% endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
  <footer class="post-footer">
    <a class="arrow-link" href="{{ '/blog/' | relative_url }}">&larr; All writing</a>
  </footer>
</article>
